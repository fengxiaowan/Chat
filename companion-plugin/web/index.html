<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>闲聊</title>
<link rel="stylesheet" href="/liao/style.css?v=20261115c">
</head>
<body>
<div class="phone">
  <header>
    <div class="bar">
      <div class="title">
        <span id="who">TA</span>
        <span id="status" class="status"></span>
      </div>
      <div class="actions">
        <button id="new" class="gear" title="新对话">＋</button>
        <button id="gear" class="gear" title="设置">⚙</button>
      </div>
    </div>
  </header>

  <main id="list" class="list"></main>

  <footer>
    <div id="preview" class="preview" hidden>
      <img id="preview-img" alt="预览">
      <button id="preview-x" class="preview-x" title="移除">✕</button>
    </div>
    <div class="compose">
      <button id="pic" class="pic" title="发图片">🖼</button>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="说点什么…" autocomplete="off"></textarea>
      <button id="send" class="send">发送</button>
    </div>
  </footer>
</div>

<aside id="panel" class="panel">
  <div class="panel-inner">
    <div class="panel-head">
      <h2>设置 <span id="ver" class="ver"></span></h2>
      <button id="close-panel" class="panel-close" title="关闭">✕</button>
    </div>
    <p class="hint" style="margin-top:0">用的是你 DSH 账号里的模型，不用填 Key。对话会自动存到磁盘。</p>

    <div class="field">
      <span>当前上下文</span>
      <p id="usage" class="usage"></p>
    </div>

    <div class="field">
      <span>语音</span>
      <label class="checkbox"><input type="checkbox" id="autoplay"> ta 的消息自动朗读</label>
      <p class="hint">点任意一条 ta 的气泡也能朗读/停止；自动朗读开启后，新消息会按顺序读出来。</p>
    </div>

    <div class="field">
      <span>模型 <em class="tag">下一条消息生效</em></span>
      <label class="checkbox"><input type="radio" name="model" value="deepseek-flash"> flash（便宜、快）</label>
      <label class="checkbox"><input type="radio" name="model" value="deepseek-v4-pro"> pro（更聪明、更贵）</label>
      <p class="hint">切换后下一条消息就用新模型，不用重启。</p>
    </div>

    <div class="field">
      <span>它记住的 <em class="tag">聊天里自己学的</em></span>
      <div id="mem" class="mem"></div>
      <button id="clear-mem" class="link">清空记忆</button>
    </div>

    <div class="field">
      <span>事件卡 <em class="tag">聊天的浓缩记忆</em></span>
      <div id="episodes" class="episodes"></div>
    </div>

    <div class="field">
      <span>归档 <em class="tag">点一下切过去</em></span>
      <div id="threads" class="threads"></div>
    </div>

    <div class="row-btns">
      <button id="copy">复制对话</button>
      <button id="save" class="primary">好</button>
      <button id="reset">清空全部</button>
    </div>
  </div>
</aside>

<script src="/liao/app.js?v=20261115c"></script>
</body>
</html>
