<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>闲聊</title>
<link rel="stylesheet" href="/liao/style.css?v=20261127fog2">
</head>
<body>
<div class="companion-layout" id="companion-layout">
  <aside class="side" id="side">
    <nav class="mode-tabs">
      <button class="mode-tab" data-mode="gomoku" title="五子棋">⚄ 五子棋</button>
      <button class="mode-tab" data-mode="memo" title="便签">📝 便签</button>
      <button class="mode-tab" data-mode="album" title="相册">📷 相册</button>
      <button class="mode-tab" data-mode="map" title="散步纸">🗺 散步纸</button>

      <!-- 收纳：不常用的模块收进这里 -->
      <div class="mode-more" id="mode-more">
        <button id="mode-more-btn" class="mode-tab mode-more-btn" title="更多模块">⋯</button>
        <div class="mode-more-menu" id="mode-more-menu" hidden>
          <button class="mode-more-item" data-mode="game">♟ 井字棋</button>
          <button class="mode-more-item" data-mode="xiangqi">🏮 中国象棋</button>
          <button class="mode-more-item" data-mode="draw">🖍 画板</button>
          <button class="mode-more-item" data-mode="avatar" hidden>ฅ 形象</button>
        </div>
      </div>

      <button id="avatar-collapse" class="avatar-collapse" title="收起侧栏" aria-label="收起侧栏">▸</button>
    </nav>

    <section id="avatar-shell" class="avatar-shell" aria-label="虚拟形象" hidden>
<img id="avatar-poster" class="avatar-poster" src="/liao/assets/avatar/Alicia-preview.png?v=20261126album" alt="Alicia 虚拟形象预览">
      <canvas id="avatar-canvas"></canvas>
      <div class="avatar-badge">
        <span>Alicia</span>
        <span id="avatar-status">在这里</span>
      </div>
    </section>

    <section id="game-shell" class="game-shell" aria-label="下棋">
      <div class="game-head">
        <span class="game-title" id="game-title">井字棋</span>
        <span id="game-status" class="game-status">轮到你</span>
      </div>
      <div class="board" id="board" role="grid" aria-label="棋盘"></div>
      <div class="game-actions">
        <button id="game-new" class="game-btn" title="新一局">新一局</button>
        <button id="game-ai-first" class="game-btn" title="让她先手">让她先手</button>
      </div>
    </section>

    <section id="xiangqi-shell" class="xiangqi-shell" aria-label="中国象棋" hidden>
      <div class="game-head">
        <span class="game-title">中国象棋</span>
        <span id="xiangqi-status" class="game-status">轮到你</span>
      </div>
      <div class="board" id="xiangqi-board"></div>
      <div class="game-actions">
        <button id="xiangqi-new" class="game-btn" title="新一局">新一局</button>
        <button id="xiangqi-ai-first" class="game-btn" title="让她先手">让她先手</button>
        <button id="xiangqi-undo" class="game-btn xq-undo" title="悔棋">悔棋</button>
      </div>
    </section>

    <section id="memo-shell" class="memo-shell" aria-label="便签" hidden>
      <div class="memo-head">
        <span class="memo-title">便签</span>
        <span id="memo-status" class="memo-status"></span>
        <button id="memo-ai-write" class="memo-btn memo-ai-write" title="让她续写">✍</button>
        <button id="memo-new" class="memo-btn" title="新便签">＋</button>
        <button id="memo-del" class="memo-btn" title="删除当前便签">🗑</button>
      </div>
      <div class="memo-list" id="memo-list"></div>
      <textarea id="memo-editor" class="memo-editor" placeholder="写点什么…（自动保存）"></textarea>
    </section>

    <section id="draw-shell" class="draw-shell" aria-label="画板" hidden>
      <div class="draw-head">
        <span class="draw-title">画板</span>
        <span id="draw-status" class="draw-status"></span>
        <button id="draw-show" class="draw-btn" title="把画给她看">👁</button>
        <button id="draw-new" class="draw-btn" title="新画纸">＋</button>
        <button id="draw-del" class="draw-btn" title="删除当前画纸">🗑</button>
      </div>
      <div class="draw-list" id="draw-list"></div>
      <div class="draw-tools">
        <button id="tool-pen" class="draw-tool active" title="画笔">✏️</button>
        <button id="tool-eraser" class="draw-tool" title="橡皮">🧽</button>
        <button id="draw-undo" class="draw-tool" title="撤销">↩</button>
        <button id="draw-clear" class="draw-tool" title="清空当前画纸">🗑</button>
      </div>
      <div class="draw-canvas-wrap">
        <canvas id="draw-canvas"></canvas>
      </div>
    </section>

    <section id="album-shell" class="album-shell" aria-label="相册" hidden>
      <div class="album-head">
        <span class="album-title">相册</span>
        <span id="album-status" class="album-status"></span>
        <button id="album-upload" class="album-btn" title="收藏一张图片">＋</button>
      </div>
      <div class="album-grid" id="album-grid"></div>
      <input id="album-file" type="file" accept="image/*" hidden>
    </section>

    <section id="map-shell" class="map-shell" aria-label="散步纸" hidden>
      <div class="map-head">
        <span class="map-title">散步纸</span>
        <span id="map-status" class="map-status">点「定位」开始</span>
        <button id="map-locate" class="map-btn" title="定位到我这">◎</button>
        <button id="map-fog" class="map-btn" title="迷雾预览">◍</button>
      </div>
      <!-- 地图本体：纸张 + 线条 -->
      <div class="map-paper">
        <div id="walkmap"></div>
        <div class="map-grain"></div>
        <div id="walkmap-me" hidden></div>
      </div>
      <div class="map-foot">
        <span id="map-speed">—</span>
        <span class="map-credit">© OpenStreetMap · OpenFreeMap</span>
      </div>
    </section>
  </aside>

  <div class="split-bar" id="split-bar" aria-hidden="true"></div>

  <div class="phone">
    <header>
      <div class="bar">
        <div class="title">
          <span id="who">TA</span>
          <span id="status" class="status"></span>
        </div>
        <div class="actions">
          <button id="avatar-expand" class="gear" title="展开侧栏" hidden>ฅ</button>
          <button id="search" class="gear" title="搜索聊天记录">🔍</button>
          <button id="new" class="gear" title="新对话">＋</button>
          <button id="gear" class="gear" title="设置">⚙</button>
        </div>
      </div>
    </header>

    <main id="list" class="list"></main>

    <footer>
      <div id="quote-preview" class="quote-preview" hidden>
        <span class="quote-preview-text"></span>
        <button id="quote-preview-x" class="preview-x" title="移除">✕</button>
      </div>
      <div id="preview" class="preview" hidden>
        <img id="preview-img" alt="预览">
        <button id="preview-x" class="preview-x" title="移除">✕</button>
      </div>
      <div class="compose">
        <button id="pic" class="pic" title="发图片">🖼</button>
        <input id="file" type="file" accept="image/*" multiple hidden>
        <textarea id="input" rows="1" placeholder="说点什么…" autocomplete="off"></textarea>
        <button id="send" class="send">发送</button>
      </div>
    </footer>
  </div>
</div>

<aside id="panel" class="panel">
  <div class="panel-inner">
    <div class="panel-head">
      <h2>设置 <span id="ver" class="ver"></span></h2>
      <button id="close-panel" class="panel-close" title="关闭">✕</button>
    </div>
    <p class="hint" style="margin-top:0">用的是你 DSH 账号里的模型，不用填 Key。对话会自动存到磁盘。</p>

    <div class="field">
      <span>当前上下文</span>
      <p id="usage" class="usage"></p>
    </div>

    <div class="field">
      <span>语音</span>
      <label class="checkbox"><input type="checkbox" id="autoplay"> ta 的消息自动朗读</label>
      <p class="hint">点任意一条 ta 的气泡也能朗读/停止；自动朗读开启后，新消息会按顺序读出来。</p>
    </div>

    <div class="field">
      <button id="bg-toggle" class="field-toggle" type="button">聊天背景 <span class="arrow">▸</span></button>
      <div id="bg-body" class="bg-body" hidden>
        <div class="bg-row">
          <button id="bg-upload" class="mini">上传图片</button>
          <button id="bg-clear" class="mini">清除背景</button>
          <input id="bg-file" type="file" accept="image/*" hidden>
        </div>
        <div id="bg-preview" class="bg-preview" hidden></div>
        <div class="bg-row">
          <label class="bg-slider-label">缩放 <span id="bg-scale-val">135%</span></label>
          <input id="bg-scale" type="range" min="100" max="250" value="135">
        </div>
        <div class="bg-row">
          <label class="bg-slider-label">左右 <span id="bg-pos-val">62%</span></label>
          <input id="bg-pos" type="range" min="0" max="100" value="62">
        </div>
        <div class="bg-row">
          <label class="bg-slider-label">上下 <span id="bg-posy-val">50%</span></label>
          <input id="bg-posy" type="range" min="0" max="100" value="50">
        </div>
      </div>
    </div>

    <div class="field">
      <button id="mem-toggle" class="field-toggle" type="button">它记住的 <em class="tag">聊天里自己学的</em> <span class="arrow">▸</span></button>
      <div id="mem-body" hidden>
        <div id="mem" class="mem"></div>
        <button id="clear-mem" class="link">清空记忆</button>
      </div>
    </div>

    <div class="field">
      <button id="episodes-toggle" class="field-toggle" type="button">事件卡 <em class="tag">聊天的浓缩记忆</em> <span class="arrow">▸</span></button>
      <div id="episodes-body" hidden>
        <div id="episodes" class="episodes"></div>
      </div>
    </div>

    <div class="field">
      <button id="facts-toggle" class="field-toggle" type="button">人物词条 <em class="tag">长期事实</em> <span class="arrow">▸</span></button>
      <div id="facts-body" hidden>
        <div id="facts" class="facts"></div>
      </div>
    </div>

    <div class="field">
      <span>归档 <em class="tag">点一下切过去</em></span>
      <div id="threads" class="threads"></div>
    </div>

    <div class="row-btns">
      <button id="copy">复制对话</button>
      <button id="save" class="primary">好</button>
      <button id="reset">清空全部</button>
    </div>
  </div>
</aside>

<aside id="search-panel" class="search-panel">
  <div class="search-inner">
    <div class="panel-head">
      <h2>搜索聊天记录</h2>
      <button id="close-search" class="panel-close" title="关闭">✕</button>
    </div>
    <div class="search-box">
      <input id="search-input" type="text" placeholder="输入关键词…">
      <button id="search-go" class="mini">搜索</button>
    </div>
    <div id="search-results" class="search-results"></div>
  </div>
</aside>

<link rel="stylesheet" href="/liao/vendor/maplibre-gl.css">
<script src="/liao/vendor/maplibre-gl.js?v=20261127fog2"></script>
<script src="/liao/walkmap.js?v=20261127fog2"></script>
<script src="/liao/app.js?v=20261127fog2"></script>
<script>
  // 华为浏览器切回时可能回收页面进程；缓存页面壳，恢复后先把本地对话画出来。
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/liao/sw.js', { scope: '/liao' }).catch(() => {});
  }
</script>
</body>
</html>
