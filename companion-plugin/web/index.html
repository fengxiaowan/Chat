<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>闲聊</title>
<link rel="stylesheet" href="/liao/style.css?v=20261123ttsdebug">
</head>
<body>
<div class="companion-layout" id="companion-layout">
  <aside class="side" id="side">
    <nav class="mode-tabs">
      <button class="mode-tab active" data-mode="game" title="井字棋">♟ 井字棋</button>
      <button class="mode-tab" data-mode="gomoku" title="五子棋">⚄ 五子棋</button>
      <button class="mode-tab" data-mode="memo" title="便签">📝 便签</button>
      <button class="mode-tab" data-mode="draw" title="画板">🖍 画板</button>
      <button class="mode-tab" data-mode="avatar" title="形象" hidden>ฅ 形象</button>
      <button id="avatar-collapse" class="avatar-collapse" title="收起侧栏" aria-label="收起侧栏">▸</button>
    </nav>

    <section id="avatar-shell" class="avatar-shell" aria-label="虚拟形象" hidden>
<img id="avatar-poster" class="avatar-poster" src="/liao/assets/avatar/Alicia-preview.png?v=20261123ttsdebug" alt="Alicia 虚拟形象预览">
      <canvas id="avatar-canvas"></canvas>
      <div class="avatar-badge">
        <span>Alicia</span>
        <span id="avatar-status">在这里</span>
      </div>
    </section>

    <section id="game-shell" class="game-shell" aria-label="下棋">
      <div class="game-head">
        <span class="game-title" id="game-title">井字棋</span>
        <span id="game-status" class="game-status">轮到你</span>
      </div>
      <div class="board" id="board" role="grid" aria-label="棋盘"></div>
      <div class="game-actions">
        <button id="game-new" class="game-btn" title="新一局">新一局</button>
        <button id="game-ai-first" class="game-btn" title="让她先手">让她先手</button>
      </div>
    </section>

    <section id="memo-shell" class="memo-shell" aria-label="便签" hidden>
      <div class="memo-head">
        <span class="memo-title">便签</span>
        <span id="memo-status" class="memo-status"></span>
        <button id="memo-ai-write" class="memo-btn memo-ai-write" title="让她续写">✍</button>
        <button id="memo-new" class="memo-btn" title="新便签">＋</button>
        <button id="memo-del" class="memo-btn" title="删除当前便签">🗑</button>
      </div>
      <div class="memo-list" id="memo-list"></div>
      <textarea id="memo-editor" class="memo-editor" placeholder="写点什么…（自动保存）"></textarea>
    </section>

    <section id="draw-shell" class="draw-shell" aria-label="画板" hidden>
      <div class="draw-head">
        <span class="draw-title">画板</span>
        <span id="draw-status" class="draw-status"></span>
        <button id="draw-show" class="draw-btn" title="把画给她看">👁</button>
        <button id="draw-new" class="draw-btn" title="新画纸">＋</button>
        <button id="draw-del" class="draw-btn" title="删除当前画纸">🗑</button>
      </div>
      <div class="draw-list" id="draw-list"></div>
      <div class="draw-tools">
        <button id="tool-pen" class="draw-tool active" title="画笔">✏️</button>
        <button id="tool-eraser" class="draw-tool" title="橡皮">🧽</button>
        <button id="draw-undo" class="draw-tool" title="撤销">↩</button>
        <button id="draw-clear" class="draw-tool" title="清空当前画纸">🗑</button>
      </div>
      <div class="draw-canvas-wrap">
        <canvas id="draw-canvas"></canvas>
      </div>
    </section>
  </aside>

  <div class="split-bar" id="split-bar" aria-hidden="true"></div>

  <div class="phone">
    <header>
      <div class="bar">
        <div class="title">
          <span id="who">TA</span>
          <span id="status" class="status"></span>
        </div>
        <div class="actions">
          <button id="avatar-expand" class="gear" title="展开侧栏" hidden>ฅ</button>
          <button id="new" class="gear" title="新对话">＋</button>
          <button id="gear" class="gear" title="设置">⚙</button>
        </div>
      </div>
    </header>

    <main id="list" class="list"></main>

    <footer>
      <div id="preview" class="preview" hidden>
        <img id="preview-img" alt="预览">
        <button id="preview-x" class="preview-x" title="移除">✕</button>
      </div>
      <div class="compose">
        <button id="pic" class="pic" title="发图片">🖼</button>
        <input id="file" type="file" accept="image/*" multiple hidden>
        <textarea id="input" rows="1" placeholder="说点什么…" autocomplete="off"></textarea>
        <button id="send" class="send">发送</button>
      </div>
    </footer>
  </div>
</div>

<aside id="panel" class="panel">
  <div class="panel-inner">
    <div class="panel-head">
      <h2>设置 <span id="ver" class="ver"></span></h2>
      <button id="close-panel" class="panel-close" title="关闭">✕</button>
    </div>
    <p class="hint" style="margin-top:0">用的是你 DSH 账号里的模型，不用填 Key。对话会自动存到磁盘。</p>

    <div class="field">
      <span>当前上下文</span>
      <p id="usage" class="usage"></p>
    </div>

    <div class="field">
      <span>语音</span>
      <label class="checkbox"><input type="checkbox" id="autoplay"> ta 的消息自动朗读</label>
      <p class="hint">点任意一条 ta 的气泡也能朗读/停止；自动朗读开启后，新消息会按顺序读出来。</p>
    </div>

    <div class="field">
      <button id="bg-toggle" class="field-toggle" type="button">聊天背景 <span class="arrow">▸</span></button>
      <div id="bg-body" class="bg-body" hidden>
        <div class="bg-row">
          <button id="bg-upload" class="mini">上传图片</button>
          <button id="bg-clear" class="mini">清除背景</button>
          <input id="bg-file" type="file" accept="image/*" hidden>
        </div>
        <div id="bg-preview" class="bg-preview" hidden></div>
        <div class="bg-row">
          <label class="bg-slider-label">缩放 <span id="bg-scale-val">135%</span></label>
          <input id="bg-scale" type="range" min="100" max="250" value="135">
        </div>
        <div class="bg-row">
          <label class="bg-slider-label">左右 <span id="bg-pos-val">62%</span></label>
          <input id="bg-pos" type="range" min="0" max="100" value="62">
        </div>
        <div class="bg-row">
          <label class="bg-slider-label">上下 <span id="bg-posy-val">50%</span></label>
          <input id="bg-posy" type="range" min="0" max="100" value="50">
        </div>
      </div>
    </div>

    <div class="field">
      <span>它记住的 <em class="tag">聊天里自己学的</em></span>
      <div id="mem" class="mem"></div>
      <button id="clear-mem" class="link">清空记忆</button>
    </div>

    <div class="field">
      <span>事件卡 <em class="tag">聊天的浓缩记忆</em></span>
      <div id="episodes" class="episodes"></div>
    </div>

    <div class="field">
      <span>归档 <em class="tag">点一下切过去</em></span>
      <div id="threads" class="threads"></div>
    </div>

    <div class="row-btns">
      <button id="copy">复制对话</button>
      <button id="save" class="primary">好</button>
      <button id="reset">清空全部</button>
    </div>
  </div>
</aside>

<script src="/liao/app.js?v=20261123ttsdebug"></script>
<script>
  // 华为浏览器切回时可能回收页面进程；缓存页面壳，恢复后先把本地对话画出来。
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/liao/sw.js', { scope: '/liao' }).catch(() => {});
  }
</script>
</body>
</html>
